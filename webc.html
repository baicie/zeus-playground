<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f3f3" />
    <script>
      // Apply the persisted theme and language before first paint so a
      // returning dark/Chinese session never flashes the light shell.
      try {
        var saved = JSON.parse(
          localStorage.getItem('zeus-playground.settings.v2') || '{}',
        )
        var dark = saved.theme === 'dark'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // `zh` is what earlier builds stored; both values select Chinese, so a
        // returning user sees no flash of the wrong language.
        document.documentElement.lang =
          saved.locale === 'zh-CN' || saved.locale === 'zh' ? 'zh-CN' : 'en'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = dark ? '#1f1f1f' : '#f3f3f3'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Zeus WebC Studio</title>

    <script type="module" crossorigin src="/zeus-playground/assets/playground-engine.esm-bundler-B38eSwsZ.js"></script>
    <script type="module" crossorigin src="/zeus-playground/assets/main-DTiiYbkp.js"></script>
    <link rel="stylesheet" crossorigin href="/zeus-playground/assets/main-CuwJKVTp.css">
  </head>

  </body>
</html>
